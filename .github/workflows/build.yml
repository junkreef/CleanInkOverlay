# Every push: the tests, then the release package (tools/build_release.py) and a start of it the way a user would
# (tools/smoke_release.py). The zip is kept as a workflow artifact.
# A tag v<version> (the version in pyproject.toml) also puts the zip on a DRAFT release (replacing an earlier draft of that tag): look at it on the Releases
# page and press "Publish release" to make it public.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8     # the runner's console is cp1252: a traceback with Japanese in it must still print
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2         # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1         # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q --tb=short -rf 2>&1 | tee -a ci.log
      - name: Build the release package
        shell: bash
        run: |
          set -o pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            uv run python tools/build_release.py --expect-version "$GITHUB_REF_NAME" 2>&1 | tee -a ci.log
          else
            uv run python tools/build_release.py 2>&1 | tee -a ci.log
          fi
      - name: Start the package like a user would
        shell: bash
        run: |
          set -o pipefail
          uv run python tools/smoke_release.py 2>&1 | tee -a ci.log
      - name: Show the end of the output when a step failed
        # as an annotation: those can be read without signing in to GitHub, the logs cannot
        if: failure()
        shell: bash
        run: |
          msg=$(tail -n 60 ci.log | tr -d '\r' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=end of the output::$msg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9    # v7.0.2
        with:
          name: CleanInkOverlay-win64
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: CleanInkOverlay-win64
      - name: Draft release with the zip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # what changed in this version, written by hand: docs/release_notes/<tag>.md at the tag (optional)
          gh api -H "Accept: application/vnd.github.raw" "repos/${GH_REPO}/contents/docs/release_notes/${TAG}.md?ref=${TAG}" > notes.md || : > notes.md
          cat >> notes.md <<EOF

          ## ダウンロード

          下の Assets から **CleanInkOverlay-${TAG}-win64.zip** をダウンロードして、すべて展開し、中の \`CleanInkOverlay.bat\` をダブルクリックします。
          Python などを入れる必要はありません。くわしくは zip の中の「はじめにお読みください.txt」か [README](https://github.com/${GH_REPO}#readme) を見てください。

          新しいバージョンにするときも同じです。記録は \`%LOCALAPPDATA%\\CleanInkOverlay\` に残るので、そのまま引き継がれます。

          EOF
          # a tag pushed again replaces its unpublished draft; a published release is never touched (create fails on it)
          for id in $(gh api "repos/${GH_REPO}/releases" --jq ".[] | select(.draft and .tag_name == \"${TAG}\") | .id"); do
            gh api -X DELETE "repos/${GH_REPO}/releases/${id}"
          done
          gh release create "$TAG" CleanInkOverlay-*.zip --draft --verify-tag --title "CleanInkOverlay $TAG" --notes-file notes.md --generate-notes
