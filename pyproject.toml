[project]
name = "cleaninkoverlay"
version = "0.1.1"
description = "Splatoon 3 capture-video analyzer: recorder, data store, web backend"
requires-python = ">=3.13"
dependencies = [
    "opencv-python>=4.10",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pygrabber>=0.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
