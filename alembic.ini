# Alembic (schema migrations) for data/splatoon.db. The app runs `upgrade head` itself on start-up; this file
# is for hand use from the repo root:
#   uv run alembic current                                    # revision of data/splatoon.db
#   uv run alembic upgrade head [-x db=PATH]                  # migrate (another file with -x db=)
#   uv run alembic revision --autogenerate -m "add xyz"       # after editing app/db/models.py; review the file it writes
[alembic]
script_location = app/db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///data/splatoon.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
